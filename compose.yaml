name: resonance
services:
  mongo:
    image: mongo:8.0.16
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports: ["127.0.0.1:27017:27017"]
    volumes: ["mongo_data:/data/db"]
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "--eval",
          "try { rs.status().ok } catch(e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}).ok }",
        ]
      interval: 5s
      timeout: 10s
      retries: 20
  neo4j:
    image: neo4j:5.26.0-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-resonance-local-password}
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
      NEO4J_dbms_security_procedures_unrestricted: gds.*
    entrypoint:
      [
        "/bin/bash",
        "-c",
        "rm -f /plugins/gds.jar; if ! test -s /plugins/gds-2.13.2.jar; then wget --tries=3 -q https://github.com/neo4j/graph-data-science/releases/download/2.13.2/neo4j-graph-data-science-2.13.2.jar -O /plugins/gds-2.13.2.jar.tmp && mv /plugins/gds-2.13.2.jar.tmp /plugins/gds-2.13.2.jar || exit 1; fi; test -s /plugins/gds-2.13.2.jar || exit 1; exec /startup/docker-entrypoint.sh neo4j",
      ]
    ports: ["127.0.0.1:7474:7474", "127.0.0.1:7687:7687"]
    volumes: ["neo4j_data:/data", "neo4j_plugins:/plugins"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
  api:
    profiles: ["app"]
    restart: unless-stopped
    build: .
    env_file: .env
    environment:
      MONGO_URL: mongodb://mongo:27017/?replicaSet=rs0
      NEO4J_URI: bolt://neo4j:7687
      APP_ORIGIN: http://localhost:4000
    ports: ["127.0.0.1:4000:4000"]
    depends_on:
      mongo: { condition: service_healthy }
      neo4j: { condition: service_healthy }
  worker:
    profiles: ["app"]
    restart: unless-stopped
    build: .
    command: ["npm", "run", "start", "-w", "@resonance/worker"]
    env_file: .env
    environment:
      MONGO_URL: mongodb://mongo:27017/?replicaSet=rs0
      NEO4J_URI: bolt://neo4j:7687
    depends_on:
      mongo: { condition: service_healthy }
      neo4j: { condition: service_healthy }
volumes:
  mongo_data:
  neo4j_data:
  neo4j_plugins:
